name: selftest
on: [push, pull_request]

# Nothing here needs write access, and on a public repository this workflow runs code from fork
# pull requests: `pull_request` (not `pull_request_target`) keeps that code away from secrets.
permissions:
  contents: read
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/prr.mjs build-workflow --check
      - run: node scripts/prr.mjs selftest
      - run: node scripts/prr.mjs mutate --check
